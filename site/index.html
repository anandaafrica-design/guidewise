<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Guidewise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a field kit. Sticky day header, one working panel, bottom tab bar for thumb use. */
:root{
  --bg:#f4f5f1; --surface:#ffffff; --ink:#0f1a15; --muted:#4a5750; --line:#dde3de;
  --accent:#1f5546; --accent-2:#2f7a63; --accent-ink:#ffffff; --ochre:#94600f; --alert:#a3321f; --soft:#e6efe9; --sand:#f6efe2; color-scheme:light;
  --r:14px; --shadow:0 1px 2px rgb(15 26 21 / .05),0 4px 14px rgb(15 26 21 / .05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
/* Light only: designed for reading outdoors in bright sun. */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgb(17 26 22 / .05);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 12px}
header .in{max-width:640px;margin:0 auto;display:grid;gap:8px}
.tour{font:800 1.45rem/1.15 var(--display);margin:0;background:none;border:0;color:inherit;width:100%;padding:0}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 .9rem var(--body);cursor:pointer}
.days button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h2{font:700 1.25rem var(--display);margin:26px 0 12px;text-wrap:balance}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;box-sizing:border-box;min-height:46px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.field{display:grid;gap:4px;min-width:0}
.btn{border:0;border-radius:10px;padding:12px 16px;min-height:46px;font:700 1rem var(--body);cursor:pointer;background:var(--soft);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.82rem}
.x{background:none;border:0;color:var(--muted);font-size:1.4rem;cursor:pointer;padding:6px 10px;min-width:44px;min-height:44px}
/* backup */
.top{display:flex;gap:10px;align-items:center}
.acct{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 8px;min-height:40px;font:700 .82rem var(--body);cursor:pointer}
.acct svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.acct.ok{border-color:var(--accent);color:var(--accent)}
.acct.warn{border-color:var(--ochre);color:var(--ochre)}
.acct.busy{border-style:dashed}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt input{width:22px;height:22px;min-height:0;flex:none;margin-top:2px;accent-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.arm{background:var(--alert);color:#fff}
.welcome{text-align:center;background:linear-gradient(180deg,var(--soft),var(--surface));border:1px solid var(--line);border-radius:16px;padding:26px 18px 18px;margin-top:16px}
.burst{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:var(--accent);color:#fff;font:800 2rem var(--display);box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 15%,transparent);animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.burst{animation:none}}
.wtitle{font-size:1.6rem;margin:10px 0 6px}
.perk{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.pi{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:800}
.homebtn{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;color:var(--ink);font:700 .7rem var(--body);cursor:pointer;padding:2px 4px;min-width:44px;min-height:44px}
.homebtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
.homebtn.on{color:var(--accent)}
.hometitle{flex:1}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 3px rgb(17 26 22 / .04)}
.tcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.topen{display:grid;gap:2px;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}
.topen b{font:700 1.15rem var(--display)}
.arch summary{cursor:pointer;font-weight:700;margin:18px 0 6px;color:var(--muted)}
.inst{max-width:640px;margin:12px auto 0;box-sizing:border-box;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
@media (max-width:672px){.inst{margin:12px 16px 0}}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.rec{font:500 1.35rem/1.5 var(--mono);letter-spacing:.04em;background:var(--surface);border:2px dashed var(--accent);border-radius:12px;padding:14px;text-align:center;word-break:break-all;user-select:all}
/* timeline */
.tl{display:grid;gap:0}
.stop{display:grid;grid-template-columns:66px 1fr;gap:12px;position:relative}
.time{font:500 1.05rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;padding-top:12px;text-align:right}
.time small{display:block;color:var(--muted);font-size:.8rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 1px 3px rgb(17 26 22 / .04);display:grid;gap:8px;min-width:0;margin-block:6px}
.card.lunch{border-left:4px solid var(--ochre)}
.drive{grid-column:2;font:500 .85rem var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;padding-left:4px}
.drive input{width:72px;padding:6px 8px;font-size:.9rem;min-height:36px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mini .field{gap:2px}
.mini input{padding:8px 10px;font-size:1rem}
.flag{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;font-weight:700;background:color-mix(in srgb,var(--ochre) 16%,transparent);color:var(--ink);border-radius:6px;padding:4px 8px}
.alert{background:color-mix(in srgb,var(--alert) 10%,var(--surface));border-left:4px solid var(--alert);border-radius:8px;padding:10px 12px;margin:12px 0;font-size:.92rem}
/* guests */
.g{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-bottom:8px}
.ghead{display:flex;gap:8px;align-items:center}
.ghead input{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.85rem;border-radius:999px;padding:3px 9px;background:var(--soft)}
.chip.d{background:color-mix(in srgb,var(--ochre) 20%,transparent)}
.chip.b{background:color-mix(in srgb,var(--alert) 18%,transparent)}
/* checklist */
.ck{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ck input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--accent);flex:none}
.ck input[type=text]{border:0;background:transparent;padding:4px}
.ck.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
/* briefing */
/* briefing bubble on white */
.bubble{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px;white-space:pre-wrap;font-size:1rem;line-height:1.6;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{font-size:.92rem;color:var(--muted)}
/* tabbar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:6}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:10px 0 12px;font:700 .72rem var(--body);min-width:0;color:var(--muted);cursor:pointer;display:grid;gap:3px;justify-items:center}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.88rem;z-index:9}
/* documents */
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:start;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:700 .88rem var(--body);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.doc{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.doc .th{width:44px;height:44px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font:700 .7rem var(--mono);color:var(--muted);overflow:hidden}
.doc .th img{width:100%;height:100%;object-fit:cover}
.doc .meta{min-width:0}
.doc .meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--accent)}
.doc select{width:auto;padding:5px 8px;font-size:.85rem;margin-top:6px;min-height:36px}
.doc .del.arm{color:var(--alert);font-size:.8rem;font-weight:700}
.daydocs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.daydocs button{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:8px;padding:5px 9px;font:700 .8rem var(--body);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sample{font-size:.78rem;color:var(--muted);margin-top:8px}
/* ---------- v10 design layer ---------- */
.card,.g,.tcard,.doc,.perk,.opt{border-radius:var(--r)}
.card,.tcard{box-shadow:var(--shadow)}
h2{letter-spacing:-.01em}
.eyebrow{font:700 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.hello{font:800 1.7rem/1.15 var(--display);margin:18px 0 2px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 4px}
.hero{position:relative;background:linear-gradient(150deg,var(--accent) 0%,var(--accent-2) 100%);color:#fff;border-radius:20px;padding:18px 18px 16px;margin:14px 0 6px;box-shadow:0 10px 30px rgb(31 85 70 / .25);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgb(255 255 255 / .08)}
.hero .when{font:700 .8rem var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h3{font:800 1.45rem/1.2 var(--display);margin:4px 0 8px;letter-spacing:-.01em}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.95rem;opacity:.95}
.hero .now{margin-top:12px;background:rgb(255 255 255 / .14);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.hero .now b{font-weight:700}
.hero .now .t{font:500 .95rem var(--mono)}
.hero .go{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
.hero .go button{background:#fff;color:var(--accent);border:0;border-radius:999px;padding:9px 14px;font:700 .9rem var(--body);cursor:pointer}
.hero .go button.ghost{background:rgb(255 255 255 / .16);color:#fff}
.steps{display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow)}
.step .ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-size:1.15rem}
.step.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.step.hot .ic{background:var(--accent);color:#fff}
.step.warm .ic{background:var(--sand)}
.step .tx{flex:1;min-width:0}
.step .tx b{display:block}
.step .tx span{font-size:.9rem;color:var(--muted)}
.step .chev{color:var(--muted);font-size:1.3rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow)}
.tile svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:4px}
.tile b{font-size:1rem}
.tile span{font-size:.85rem;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:13px 14px;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.li:last-child{border-bottom:0}
.li svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.li .tx{flex:1;min-width:0}.li .tx span{display:block;font-size:.85rem;color:var(--muted)}
.li .chev{color:var(--muted);font-size:1.2rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.bar h2{margin:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:700 .85rem var(--body);cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* read-mode timeline */
.rt{position:relative;margin-left:4px}
.rt::before{content:"";position:absolute;left:64px;top:8px;bottom:8px;width:2px;background:var(--line)}
.rs{display:grid;grid-template-columns:52px 1fr;gap:22px;position:relative;padding:6px 0}
.rs .tm{font:500 1rem var(--mono);text-align:right;padding-top:10px;font-variant-numeric:tabular-nums}
.rs .tm small{display:block;color:var(--muted);font-size:.75rem}
.rs .dot{position:absolute;left:58px;top:18px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.rs.lunch .dot{border-color:var(--ochre)}
.rs.free .dot{border-color:var(--line);background:var(--bg)}
.rs.nowp .dot{background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.rs .bx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.rs.free .bx{background:transparent;box-shadow:none;border-style:dashed;color:var(--muted)}
.rs.lunch .bx{border-left:4px solid var(--ochre)}
.rs .bx b{display:block;overflow-wrap:anywhere}
.rs .bx .note{display:block;margin-top:2px}
.leg{grid-column:2;font:500 .82rem var(--mono);color:var(--muted);padding:0 0 0 2px}
.warn{color:var(--ochre);font-weight:700}
/* guest list */
.gl{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer;box-shadow:var(--shadow)}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font:800 .95rem var(--display)}
.gl .tx{flex:1;min-width:0}.gl .tx b{display:block}
.gl .chips{margin-top:6px}
.empty{text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;margin:12px 0}
.empty b{display:block;font:700 1.1rem var(--display);margin-bottom:4px}
.mini-inst{display:flex;align-items:center;gap:10px;background:var(--sand);border-radius:var(--r);padding:10px 12px;margin:14px 0 0;font-size:.92rem}
.mini-inst span{flex:1}
nav button.on{color:var(--accent);box-shadow:none}
nav button.on svg{background:var(--soft);border-radius:999px;padding:3px 14px;box-sizing:content-box}
nav button svg{padding:3px 14px;box-sizing:content-box}
.days button .td{display:inline-block;margin-left:6px;background:var(--ochre);color:#fff;border-radius:999px;padding:0 6px;font-size:.72rem}
.days button.on .td{background:#fff;color:var(--accent)}
.tour{border-radius:8px}
.tour:focus{background:var(--soft)}
/* ---------- v11: safari contours and colour ---------- */
:root{--sky:#2f6ea5;--game:#3f7a34;--plum:#7a4b8c;--rose:#b2465a}
body{background:var(--bg) url(topo.svg) right -160px top 40px/720px auto no-repeat fixed}
header{border-bottom:0;box-shadow:0 2px 12px rgb(15 26 21 / .06);background:linear-gradient(var(--surface),var(--surface)) padding-box}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2) 40%,var(--ochre) 75%,#c98a2c)}
.hero{background:url(topo-w.svg) right -120px center/560px auto no-repeat,linear-gradient(150deg,var(--accent) 0%,var(--accent-2) 100%)}
.hero::after{display:none}
.hello{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ic.c-brief{background:#e3f1ea}.ic.c-pack{background:var(--sand)}.ic.c-bday{background:#f8e3e7}.ic.c-food{background:#f6ead6}.ic.c-plan{background:#e3edf7}.ic.c-guest{background:#efe6f3}.ic.c-cloud{background:#e8eef0}
.step.hot .ic{background:var(--accent)!important}
.tile{position:relative;overflow:hidden}
.tile .tic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:6px}
.tile .tic svg{margin:0;width:22px;height:22px}
.tile.t-plan .tic{background:#e3edf7}.tile.t-plan svg{stroke:var(--sky)}
.tile.t-guests .tic{background:#efe6f3}.tile.t-guests svg{stroke:var(--plum)}
.tile.t-pack .tic{background:var(--sand)}.tile.t-pack svg{stroke:var(--ochre)}
.tile.t-docs .tic{background:#e3f1ea}.tile.t-docs svg{stroke:var(--accent)}
.tile .bar2{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--soft)}.tile .bar2 i{display:block;height:100%;background:var(--ochre)}
/* stop types */
.rs .bx{border-left:4px solid var(--k,var(--accent))}
.rs .dot{border-color:var(--k,var(--accent))}
.rs.k-meal{--k:var(--ochre)}.rs.k-flight{--k:var(--sky)}.rs.k-game{--k:var(--game)}.rs.k-hotel{--k:var(--plum)}.rs.k-free{--k:var(--line)}

<script>
const KEY='tourPrepKit.v1';
const sample={

};
/* Several tours. T holds them all; S is the open tour. The v1 single tour (KEY) is migrated once and left in place as a safety copy. */
const KEY2='guidewise.tours.v2';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
let T;
try{T=JSON.parse(localStorage.getItem(KEY2))}catch(e){}
if(!T||!Array.isArray(T.tours)||!T.tours.length){let old;try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!old||!old.days)old=structuredClone(sample);
  old.id=old.id||uid();T={v:2,cur:old.id,legacyDocs:old.id,tours:[old]}}
let S=T.tours.find(t=>t.id===T.cur)||T.tours[0];
let tab='today',editDay=false,editG=-1,panelOpen=false;
/* The tour switcher at the top: every current tour, newest first by start date, with new, import and rename. */
const dShort=iso=>iso?new Date(iso+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
const shortRange=m=>!m.a?'No dates yet':m.a===m.b?dShort(m.a):dShort(m.a)+' to '+dShort(m.b);
function tourPanel(){
  const today=todayIso(),rank=t=>{const m=tourMeta(t);return !m.a?2:m.a<=today&&m.b>=today?0:m.b<today?3:1};
  const list=T.tours.filter(t=>!t.archived).sort((x,y)=>{const r=rank(x)-rank(y);if(r)return r;const a=tourMeta(x).a||'',b=tourMeta(y).a||'';return rank(x)===3?(a<b?1:-1):(a<b?-1:1)});
  const row=t=>{const m=tourMeta(t),live=m.a&&m.a<=today&&m.b>=today,past=m.b&&m.b<today;
    return `<button class="tp-row ${t.id===S.id?'cur':''}" data-topen="${t.id}"><span class="tp-dot"></span><span class="tx"><b>${esc(t.tour)||'Untitled tour'}</b><span class="note">${esc(shortRange(m))} · ${t.guests.length} guest${t.guests.length===1?'':'s'}${past?' · finished':''}</span></span>${live?'<span class="live">On tour</span>':''}</button>`};
  const arc=T.tours.filter(t=>t.archived).length;
  return `<p class="eyebrow" style="margin:2px 0 4px">Your tours</p>${list.map(row).join('')||'<p class="note">No current tours.</p>'}
  <div class="tp-acts"><button class="btn pri" data-tnew="1">+ New tour</button><button class="btn" data-tab="import">✦ Import</button></div>
  <div class="field" style="margin-top:14px"><span class="lbl">Rename the open tour</span><input id="tourName" value="${esc(S.tour)}" aria-label="Tour name"></div>
  <button class="tp-foot" data-tab="home">Manage tours: duplicate, archive, delete${arc?` · ${arc} archived`:''} ›</button>`;
}
const save=()=>{try{localStorage.setItem(KEY2,JSON.stringify(T))}catch(e){}if(window.onSaved)onSaved()};
/* Used by backup.js on restore: accepts v2 {T} or a v1 single tour {S}. */
window.applyBackup=o=>{let nt=o.T;if(!nt){const t=o.S;t.id=t.id||uid();nt={v:2,cur:t.id,tours:[t]}}
  nt.legacyDocs=T.legacyDocs;T=nt;S=T.tours.find(t=>t.id===T.cur)||T.tours[0];T.cur=S.id};
const newDay=date=>({date,title:'New day',meet:'Hotel lobby',start:'08:00',weather:'',dress:'',bring:'',stops:[{place:'First stop',drive:30,stay:60,note:'',lunch:false}],checklist:[{t:'Cash',d:false},{t:'Tickets',d:false}]});
function openTour(id){const t=T.tours.find(x=>x.id===id);if(!t)return;S=t;T.cur=id;tab='today';editDay=false;editG=-1;save();render();scrollTo(0,0)}
function tourMeta(t){const ds=t.days.map(d=>d.date).filter(Boolean).sort(),a=ds[0],b=ds[ds.length-1];return{a,b,range:a?(a===b?dLabel(a):dLabel(a)+' to '+dLabel(b)):'No dates yet'}}
const docMine=f=>(f.tour||T.legacyDocs)===S.id;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=()=>S.days[S.day]||S.days[0];
const toMin=t=>{const[h,m]=(t||'08:00').split(':').map(Number);return h*60+(m||0)};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dLabel=iso=>{if(!iso)return'';const d=new Date(iso+'T12:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,1800)}
function schedule(day){let cur=toMin(day.start);return day.stops.map((s,i)=>{const arrive=cur+(+s.drive||0);const leave=arrive+(+s.stay||0);cur=leave;return{arrive,leave}})}
function bdays(day){const md=(day.date||'').slice(5);return S.guests.filter(g=>g.bday&&g.bday===md)}
function diets(){return S.guests.filter(g=>g.diet)}

const icons={
 home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></svg>',
 plan:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 guests:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14c2.4 0 4.2 1.4 5 4"/></svg>',
 pack:'<svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5h6v2M9 13l2 2 4-4"/></svg>',
 brief:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',
 docs:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
 intel:'<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>',
 today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>',
 tours:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>',
 cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.2 4.5 4.5 0 0 0 7 18z"/></svg>',
 spark:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>',
 count:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.8-3.2 3.2-5 6-5s5.2 1.8 6 5"/><path d="M16 11l2 2 4-4"/></svg>',
 help:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>'
};
const NAV=[['today','Today'],['plan','Day'],['guests','Guests'],['brief','Briefing'],['more','More']];
const UNDER_MORE=['more','count','pack','docs','intel','acct','plus','import','home'];
const DAY_TABS=['plan','pack','brief','docs'];
const names={home:'Home',plan:'Day plan',guests:'Guests',pack:'Checklist',brief:'Briefing',docs:'Documents',intel:'Local intel'};

function renderChrome(){
  const m=tourMeta(S);$('#tswName').textContent=S.tour||'Untitled tour';
  $('#tswMeta').textContent=`${shortRange(m)} · ${S.days.length} day${S.days.length===1?'':'s'} · ${S.guests.length} guest${S.guests.length===1?'':'s'}`;
  $('#tsw').setAttribute('aria-expanded',String(panelOpen));$('#tback').hidden=!panelOpen;
  const tp=$('#tpanel');tp.hidden=!panelOpen;if(panelOpen&&!tp.contains(document.activeElement))tp.innerHTML=tourPanel();
  $('#days').hidden=!DAY_TABS.includes(tab);
  const td=todayIso();
  $('#days').innerHTML=S.days.map((d,i)=>`<button class="${i===S.day?'on':''}" data-day="${i}">Day ${i+1} · ${esc(dLabel(d.date))}${d.date===td?'<span class="td">today</span>':''}</button>`).join('')+`<button data-addday="1" aria-label="Add a day">+ Day</button>`;
  const on=k=>k===tab||(k==='more'&&UNDER_MORE.includes(tab));
  $('#tabs').innerHTML=NAV.map(([k,l])=>`<button class="${on(k)?'on':''}" data-tab="${k}" aria-label="${l}">${icons[k]}<span>${l}</span></button>`).join('');
  const cur=$('#days .on');if(cur&&DAY_TABS.includes(tab))cur.scrollIntoView({inline:'center',block:'nearest'});
}

/* ---------- Weather: free Open-Meteo forecast for the day's area. Only the area name and date are sent. ---------- */
const WX_KEY='guidewise.wx';let wxMem={};try{wxMem=JSON.parse(localStorage.getItem(WX_KEY))||{}}catch(e){}
const WMO=c=>c===0?['☀️','Sunny']:c<=2?['🌤','Mostly sunny']:c===3?['☁️','Cloudy']:c<=48?['🌫','Fog']:c<=57?['🌦','Drizzle']:c<=67?['🌧','Rain']:c<=77?['🌨','Snow']:c<=82?['🌦','Showers']:['⛈','Thunderstorms'];
function wxFor(d){return d&&d.area&&d.date?wxMem[d.area.toLowerCase()+'|'+d.date]:null}
const wxBusy=new Set();
async function ensureWx(d){
  if(!d||!d.area||!d.date||!navigator.onLine)return;const k=d.area.toLowerCase()+'|'+d.date,c=wxMem[k];
  const ahead=daysBetween(todayIso(),d.date);if(ahead<0||ahead>15)return;
  if(c&&Date.now()-c.at<3*3600e3){applyWx(d,c);return}if(wxBusy.has(k))return;wxBusy.add(k);
  try{let g=wxMem['geo|'+d.area.toLowerCase()];
    if(!g){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&name='+encodeURIComponent(d.area)).then(r=>r.json());const x=r.results&&r.results[0];if(!x)throw 0;g={lat:x.latitude,lon:x.longitude,name:x.name+(x.country_code?', '+x.country_code:'')};wxMem['geo|'+d.area.toLowerCase()]=g}
    const f=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=auto&start_date=${d.date}&end_date=${d.date}`).then(r=>r.json());
    const y=f.daily;if(!y||!y.time||!y.time.length)throw 0;
    const [ic,word]=WMO(y.weather_code[0]),w={ic,word,lo:Math.round(y.temperature_2m_min[0]),hi:Math.round(y.temperature_2m_max[0]),rain:y.precipitation_probability_max[0]??0,wind:Math.round(y.wind_speed_10m_max[0]),place:g.name,at:Date.now()};
    wxMem[k]=w;try{localStorage.setItem(WX_KEY,JSON.stringify(wxMem))}catch(e){}applyWx(d,w,true);
  }catch(e){}finally{wxBusy.delete(k)}
}
const wxText=w=>`${w.word}, ${w.lo} to ${w.hi}°C${w.wind>=25?`, wind up to ${w.wind} km/h`:''}${w.rain>=20?`, ${w.rain}% chance of rain`:''}`;
function applyWx(d,w,fresh){const t=wxText(w);if((!d.weather||d.wxAuto)&&d.weather!==t){d.weather=t;d.wxAuto=true;save();if(fresh||tab==='brief'||tab==='today')render()}else if(fresh&&(tab==='today'||tab==='plan'))render()}
function wxCard(d){const w=wxFor(d);if(!w)return d.area?'':`<button class="step" data-go="plan:${S.days.indexOf(d)}" data-edit-after="1" style="margin:10px 0"><span class="ic c-plan">🌤</span><span class="tx"><b>Get the weather for this day</b><span>Add the town or area in Edit day</span></span><span class="chev">›</span></button>`;
  return `<div class="wx"><span class="i">${w.ic}</span><span><b>${esc(wxText(w))}</b><span class="note">${esc(w.place)} · forecast by Open-Meteo</span></span></div>`}

/* ---------- Venues: phone and address remembered by name, offered again on later tours ---------- */
const vKey=n=>String(n||'').trim().toLowerCase();
function venueSync(st,k){if(!st||/^free time$/i.test(st.place)||/^✈/.test(st.place))return false;T.venues=T.venues||{};const key=vKey(st.place);if(!key)return false;
  if(k==='place'){const v=T.venues[key];if(v&&(!st.phone&&!st.addr)){st.phone=v.phone||'';st.addr=v.addr||'';return true}return false}
  if(st.phone||st.addr)T.venues[key]={phone:st.phone||'',addr:st.addr||''};return false}
const telOf=p=>String(p||'').replace(/[^\d+]/g,'');
const dirUrl=s=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.addr||s.place);
function stopActs(s){if(/^free time$/i.test(s.place)||/^✈/.test(s.place))return'';
  return `<div class="sacts">${s.phone?`<a href="tel:${esc(telOf(s.phone))}">📞 Call</a>`:''}<a href="${esc(dirUrl(s))}" target="_blank" rel="noopener">🧭 Directions</a></div>`}

/* ---------- Headcount: tap guests back on board ---------- */
let hc=new Set();
function renderCount(){

/* ---------- Today: the day that matters now, and what to do next ---------- */
const todayIso=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const isBlankDay=d=>!d.stops.length||(d.stops.length===1&&d.stops[0].place==='First stop')||d.title==='New day';
function focusDay(){const t=todayIso();
  let i=S.days.findIndex(d=>d.date===t);if(i>=0)return{i,rel:'Today',n:0};
  i=S.days.findIndex(d=>d.date&&d.date>t);if(i>=0){const n=daysBetween(t,S.days[i].date);return{i,rel:n===1?'Tomorrow':'In '+n+' days',n}}
  return{i:Math.min(S.day,S.days.length-1),rel:S.days.some(d=>d.date)?'Tour finished':'Next up',n:-1}}
function nowNext(day){const sc=schedule(day),d=new Date(),m=d.getHours()*60+d.getMinutes();
  let now=-1,next=-1;sc.forEach((x,k)=>{if(x.arrive<=m&&m<x.leave)now=k;if(next<0&&x.arrive>m)next=k});return{sc,now,next,m}}
function nextSteps(f){
  const d=S.days[f.i],out=[],hr=new Date().getHours(),di=diets();
  const n=d.checklist.length,left=d.checklist.filter(c=>!c.d).length;
  if(S.tour.includes('(sample)'))out.push({ic:'✦',c:'plan',t:'Start your own tour',s:'Import your itinerary, or start from scratch',go:'home',cls:'hot'});
  if(!S.guests.length)out.push({ic:'👥',c:'guest',t:'Add your guests',s:'Rooms, birthdays and dietary needs, or import a rooming list',go:'guests',cls:S.tour.includes('(sample)')?'':'hot'});
  const blank=S.days.findIndex(isBlankDay);if(blank>=0)out.push({ic:'🗺',c:'plan',t:`Plan Day ${blank+1}`,s:S.days[blank].date?dLabel(S.days[blank].date):'Add stops and times',go:'plan:'+blank});
  const bd=bdays(d);if(bd.length)out.push({ic:'🎂',c:'bday',t:`${bd.map(g=>g.name.split(' ')[0]).join(' and ')}: birthday ${f.rel.toLowerCase()}`,s:'Arrange a cake or card with the venue',go:'guests',cls:'warm'});
  if(f.n===1||(f.n===0&&hr<10))out.push({ic:'💬',c:'brief',t:f.n===1?"Send tomorrow's briefing":"Send today's briefing",s:'Ready to send to your WhatsApp group',go:'brief:'+f.i,cls:f.n===1&&hr>=15?'hot':''});
  if(n&&left&&f.n>=0&&f.n<=1)out.push({ic:'🎒',c:'pack',t:`${left} thing${left>1?'s':''} to pack for ${f.rel.toLowerCase()}`,s:d.checklist.filter(c=>!c.d).slice(0,2).map(c=>c.t).join(', '),go:'pack:'+f.i});
  const lunch=d.stops.find(s=>s.lunch);if(lunch&&di.length&&f.n>=0&&f.n<=2)out.push({ic:'🍽',c:'food',t:`Tell ${lunch.place.replace(/^Lunch (at )?/i,'')} about ${di.length} dietary need${di.length>1?'s':''}`,s:di.slice(0,3).map(g=>g.name.split(' ')[0]+': '+g.diet).join(' · '),go:'plan:'+f.i,cls:'warm'});
  const w=wxFor(d);if(w&&(w.wind>=40||w.rain>=60))out.unshift({ic:w.wind>=40?'💨':'🌧',c:'plan',t:w.wind>=40?`Strong wind ${f.rel.toLowerCase()}: ${w.wind} km/h`:`Rain likely ${f.rel.toLowerCase()}: ${w.rain}%`,s:'Check exposed stops, boat trips and the briefing',go:'plan:'+f.i,cls:'warm'});
  if(!d.area&&f.n>=0&&f.n<=15)out.push({ic:'🌤',c:'plan',t:'Add the area to get the weather',s:`Day ${f.i+1}: town or region, in Edit day`,go:'plan:'+f.i,edit:1});
  if(typeof sync!=='undefined'&&!sync.acct&&!S.tour.includes('(sample)'))out.push({ic:'☁',c:'cloud',t:'Back up your tours',s:'So a lost phone does not cost you your planning',go:'acct'});
  return out.slice(0,4);
}

/* ---------- Documents: stored offline in IndexedDB ---------- */
let docFilter='day';
const DB=new Promise((res,rej)=>{try{const r=indexedDB.open('guidewise-docs',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
const tx=(mode,fn)=>DB.then(db=>new Promise((res,rej)=>{const t=db.transaction('files',mode);const st=t.objectStore('files');const out=fn(st);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)}));
const dbAll=()=>DB.then(db=>new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const dbGet=id=>DB.then(db=>new Promise((res,rej)=>{const r=db.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const dbDel=id=>tx('readwrite',st=>st.delete(id));
const dbMove=(id,day)=>dbGet(id).then(f=>{f.day=day;return tx('readwrite',st=>st.put(f))});
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const ext=n=>(n.split('.').pop()||'').slice(0,4).toUpperCase();
const dayName=v=>v==='all'?'Whole tour':'Day '+(+v+1)+(S.days[+v]?' · '+S.days[+v].title:'');
const thumbs=new Map();
function thumb(f){if(!f.type.startsWith('image/'))return'';if(!thumbs.has(f.id))thumbs.set(f.id,URL.createObjectURL(f.blob));return thumbs.get(f.id)}
async function addFiles(list){
  const files=[...list];if(!files.length)return;
  const day=($('#docDay')||{}).value??String(S.day);
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  try{for(const f of files)await tx('readwrite',st=>st.add({tour:S.id,name:f.name,type:f.type||'application/octet-stream',size:f.size,day,added:new Date().toISOString().slice(0,10),blob:f}));
    toast(files.length+' document'+(files.length>1?'s':'')+' added')}
  catch(e){toast('Could not save: phone storage may be full')}
  fillDocs();
}
async function openDoc(id){
  const f=await dbGet(id);if(!f)return;
  const url=URL.createObjectURL(f.blob);
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';
  if(!/^(application\/pdf|image\/|text\/)/.test(f.type))a.download=f.name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}

  </div>

}
async function fillDocs(){
  const list=$('#docList');if(!list)return;
  let all=[];try{all=(await dbAll()).filter(docMine)}catch(e){list.innerHTML='<p class="note">Document storage is not available in this browser.</p>';return}
  const cur=String(S.day);
  $('#docSeg').innerHTML=[['day','This day ('+all.filter(f=>f.day===cur||f.day==='all').length+')'],['tour','Whole tour only ('+all.filter(f=>f.day==='all').length+')'],['','Everything ('+all.length+')']].map(([k,l])=>`<button class="${docFilter===k?'on':''}" data-dfilter="${k}">${l}</button>`).join('');
  const shown=all.filter(f=>docFilter==='day'?(f.day===cur||f.day==='all'):docFilter==='tour'?f.day==='all':true).sort((a,b)=>(a.day==='all'?-1:+a.day)-(b.day==='all'?-1:+b.day)||b.id-a.id);
  list.innerHTML=shown.length?shown.map(f=>{const t=thumb(f);const opts=`<option value="all" ${f.day==='all'?'selected':''}>Whole tour</option>`+S.days.map((d,i)=>`<option value="${i}" ${f.day===String(i)?'selected':''}>Day ${i+1}</option>`).join('');
    return `<div class="doc"><div class="th">${t?`<img src="${t}" alt="">`:esc(ext(f.name))}</div>
    <div class="meta"><b data-dopen="${f.id}" role="button" tabindex="0">${esc(f.name)}</b><span class="note">${kb(f.size)} · added ${esc(dLabel(f.added))}</span><br><select data-dmove="${f.id}" id="dm-${f.id}" aria-label="File under">${opts}</select></div>
    <button class="x del" data-ddel="${f.id}" aria-label="Delete document">×</button></div>`}).join('')
    :`<p class="note">No documents ${docFilter==='day'?'for this day':'yet'}. Add vouchers and tickets above so they are on hand without signal.</p>`;
  try{const e=await navigator.storage.estimate();$('#docStore').textContent=`Using ${kb(e.usage||0)} of phone storage. Documents stay on this device only.`}catch(e){}
  const dr=$('#drop');if(dr&&!dr._w){dr._w=1;['dragover','dragenter'].forEach(t=>dr.addEventListener(t,ev=>{ev.preventDefault();dr.classList.add('over')}));['dragleave','drop'].forEach(t=>dr.addEventListener(t,ev=>{ev.preventDefault();dr.classList.remove('over')}));dr.addEventListener('drop',ev=>addFiles(ev.dataTransfer.files))}
}
async function fillDayDocs(){
  const box=$('#dayDocs');if(!box)return;
  let all=[];try{all=(await dbAll()).filter(docMine)}catch(e){return}
  const mine=all.filter(f=>f.day===String(S.day)||f.day==='all');
  box.innerHTML=`<h2>Documents for today</h2>`+(mine.length?`<div class="daydocs">${mine.map(f=>`<button data-dopen="${f.id}">${esc(f.name)}</button>`).join('')}</div>`:`<p class="note">None filed yet. <button class="btn sm" data-tab="docs">Add documents</button></p>`);
}

render();
